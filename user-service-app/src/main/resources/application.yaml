spring:
  application:
    name: user-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  datasource:
    url: ${ENV_USER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${ENV_USER_DATASOURCE_USERNAME:appuser}
    password: ${ENV_USER_DATASOURCE_PASSWORD:Password@123}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:user_mgmt}
    liquibase-schema: ${SPRING_LIQUIBASE_LIQUIBASE_SCHEMA:public}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:user_mgmt}
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8082}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:4201,http://localhost:4211,http://localhost:8080,https://dev.electrahub.com,https://dev.electrahub.com:8443,http://driver-portal-dev.electrahub.com:8080,https://driver-portal-dev.electrahub.com,https://driver-portal-dev.electrahub.com:8443,https://driver-portal-*.electrahub.com,https://driver-portal-*.electrahub.com:*,https://admin-portal-dev.electrahub.com,https://admin-portal-dev.electrahub.com:8443,https://admin-portal-*.electrahub.com,https://admin-portal-*.electrahub.com:*}
  payment-service:
    base-url: ${APP_PAYMENT_SERVICE_BASE_URL:http://payment-service:8083}
  notification:
    exchange: ${APP_NOTIFICATION_EXCHANGE:notifications.events}
    domain-routing-key: ${APP_NOTIFICATION_DOMAIN_ROUTING_KEY:notifications.domain}
    tenant-id: ${APP_NOTIFICATION_TENANT_ID:electrahub}
    outbox:
      publish-delay-ms: ${APP_NOTIFICATION_OUTBOX_PUBLISH_DELAY_MS:5000}
      batch-size: ${APP_NOTIFICATION_OUTBOX_BATCH_SIZE:25}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:auth-service}
      secret: ${APP_SECURITY_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_64+_CHAR_SECRET_CHANGE_ME}
  dev-admin:
    enabled: ${APP_DEV_ADMIN_ENABLED:false}
    email: ${APP_DEV_ADMIN_EMAIL:sysadmin.dev@electrahub.com}
    password: ${APP_DEV_ADMIN_PASSWORD:Admin@12345}
    first-name: ${APP_DEV_ADMIN_FIRST_NAME:System}
    last-name: ${APP_DEV_ADMIN_LAST_NAME:Admin}
    phone-number: ${APP_DEV_ADMIN_PHONE_NUMBER:+15550000001}
  dev-user:
    password: ${APP_DEV_USER_PASSWORD:User@12345}
  rbac:
    policy-key: ${APP_RBAC_POLICY_KEY:gateway-default}
    internal-api-key: ${APP_RBAC_INTERNAL_API_KEY:dev-rbac-internal-key}
    gateway-base-url: ${APP_RBAC_GATEWAY_BASE_URL:http://api-gateway:8090}
    gateway-invalidate-path: ${APP_RBAC_GATEWAY_INVALIDATE_PATH:/internal/rbac/cache/invalidate}
    access-scope-cache-prefix: ${APP_INTERNAL_ACCESS_CONTEXT_CACHE_PREFIX:admin:access-scope:v1:}
    access-scope-cache-generation-ttl: ${APP_INTERNAL_ACCESS_CONTEXT_CACHE_GENERATION_TTL:35d}
  terms:
    initial-version:
      enabled: ${APP_TERMS_INITIAL_VERSION_ENABLED:true}
      admin-email: ${APP_TERMS_INITIAL_VERSION_ADMIN_EMAIL:${APP_DEV_ADMIN_EMAIL:sysadmin.dev@electrahub.com}}
      version-label: ${APP_TERMS_INITIAL_VERSION_LABEL:May 2026}
      content-url: ${APP_TERMS_INITIAL_VERSION_CONTENT_URL:https://cdn.electrahub.com/legal/terms/v1.html}
      content-sha256: ${APP_TERMS_INITIAL_VERSION_CONTENT_SHA256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      content-text: ${APP_TERMS_INITIAL_VERSION_CONTENT_TEXT:}
      requires-re-acceptance: ${APP_TERMS_INITIAL_VERSION_REQUIRES_RE_ACCEPTANCE:true}

management:
   endpoints:
     web:
       exposure:
         include: health,info,metrics,prometheus
   endpoint:
     health:
       probes:
         enabled: true
   otlp:
     tracing:
       endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
   tracing:
     sampling:
       probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    root: INFO
    com.electrahub.user: INFO

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9082}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:true}
    health-service-enabled: true

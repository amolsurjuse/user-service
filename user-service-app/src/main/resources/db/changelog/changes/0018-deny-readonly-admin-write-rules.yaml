databaseChangeLog:
  - changeSet:
      id: 0018-deny-readonly-admin-write-rules
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              WITH policy AS (
                SELECT id
                FROM rbac_policies
                WHERE policy_key = 'gateway-default'
              ),
              requested_rules(rule_id, name, methods, path_pattern, effect, allow_anonymous, required_roles) AS (
                VALUES
                  ('00000000-0000-0000-0000-000000000801'::uuid, 'readonly-admin-user-write-deny', 'POST,PUT,PATCH,DELETE', '/user/api/v1/admin/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000802'::uuid, 'readonly-admin-terms-write-deny', 'POST,PUT,PATCH,DELETE', '/admin/api/v1/terms/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000803'::uuid, 'readonly-admin-terms-root-write-deny', 'POST,PUT,PATCH,DELETE', '/admin/api/v1/terms', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000804'::uuid, 'readonly-admin-billing-write-deny', 'POST,PUT,PATCH,DELETE', '/billing/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000805'::uuid, 'readonly-admin-charger-write-deny', 'POST,PUT,PATCH,DELETE', '/charger/api/v1/admin/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000806'::uuid, 'readonly-admin-subscription-admin-write-deny', 'POST,PUT,PATCH,DELETE', '/subscription/api/v1/admin/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000807'::uuid, 'readonly-admin-subscription-write-deny', 'POST,PUT,PATCH,DELETE', '/subscription/api/v1/subscriptions/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000808'::uuid, 'readonly-admin-pricing-write-deny', 'POST,PUT,PATCH,DELETE', '/pricing/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000811'::uuid, 'readonly-admin-station-write-deny', 'POST,PUT,PATCH,DELETE', '/station/**', 'DENY', false, 'ADMIN_READ_ONLY'),
                  ('00000000-0000-0000-0000-000000000812'::uuid, 'readonly-admin-charger-management-write-deny', 'POST,PUT,PATCH,DELETE', '/charger-management/**', 'DENY', false, 'ADMIN_READ_ONLY')
              ),
              missing_rules AS (
                SELECT
                  row_number() OVER (ORDER BY rr.rule_id) AS rn,
                  rr.*
                FROM requested_rules rr
                CROSS JOIN policy p
                WHERE NOT EXISTS (
                  SELECT 1
                  FROM rbac_policy_rules existing
                  WHERE existing.policy_id = p.id
                    AND existing.name = rr.name
                )
              ),
              base_sort AS (
                SELECT p.id AS policy_id, COALESCE(MAX(r.sort_order), -1) AS max_sort_order
                FROM policy p
                LEFT JOIN rbac_policy_rules r ON r.policy_id = p.id
                GROUP BY p.id
              ),
              inserted AS (
                INSERT INTO rbac_policy_rules (
                  id,
                  policy_id,
                  sort_order,
                  name,
                  methods,
                  path_pattern,
                  effect,
                  allow_anonymous,
                  required_roles
                )
                SELECT
                  m.rule_id,
                  b.policy_id,
                  b.max_sort_order + m.rn,
                  m.name,
                  m.methods,
                  m.path_pattern,
                  m.effect,
                  m.allow_anonymous,
                  m.required_roles
                FROM missing_rules m
                CROSS JOIN base_sort b
                RETURNING policy_id
              )
              UPDATE rbac_policies p
              SET version = p.version + 1,
                  updated_at = now()
              WHERE p.id IN (SELECT DISTINCT policy_id FROM inserted);

databaseChangeLog:
  - changeSet:
      id: 0046-create-privacy-request-events
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE user_mgmt.privacy_request_events (
                id UUID PRIMARY KEY,
                request_id UUID NOT NULL REFERENCES user_mgmt.privacy_requests(id),
                event_type VARCHAR(32) NOT NULL,
                resulting_status VARCHAR(24) NOT NULL,
                reason_code VARCHAR(80),
                legal_basis VARCHAR(500),
                retention_until TIMESTAMPTZ,
                actor_id VARCHAR(160) NOT NULL,
                occurred_at TIMESTAMPTZ NOT NULL,
                CONSTRAINT ck_privacy_event_type CHECK (event_type IN ('REVIEW_STARTED','LAWFUL_HOLD_APPLIED','FULFILLED','REJECTED')),
                CONSTRAINT ck_privacy_event_status CHECK (resulting_status IN ('IN_REVIEW','FULFILLED','REJECTED')),
                CONSTRAINT ck_privacy_hold_fields CHECK (
                  (event_type='LAWFUL_HOLD_APPLIED' AND legal_basis IS NOT NULL AND retention_until IS NOT NULL)
                  OR event_type<>'LAWFUL_HOLD_APPLIED'
                )
              );
              CREATE INDEX idx_privacy_request_event_timeline
                ON user_mgmt.privacy_request_events(request_id, occurred_at DESC);
              CREATE OR REPLACE FUNCTION user_mgmt.reject_privacy_request_event_mutation() RETURNS trigger AS $$
              BEGIN
                RAISE EXCEPTION 'privacy request events are append-only';
              END;
              $$ LANGUAGE plpgsql;
              CREATE TRIGGER trg_privacy_request_event_immutable BEFORE UPDATE OR DELETE
                ON user_mgmt.privacy_request_events FOR EACH ROW
                EXECUTE FUNCTION user_mgmt.reject_privacy_request_event_mutation();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_privacy_request_event_immutable ON user_mgmt.privacy_request_events;
              DROP FUNCTION IF EXISTS user_mgmt.reject_privacy_request_event_mutation();
              DROP TABLE IF EXISTS user_mgmt.privacy_request_events;
